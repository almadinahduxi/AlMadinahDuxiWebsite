<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Under Construction | Al Madinah Duxi</title>
<meta name="description" content="Al Madinah Duxi is under construction. Check back soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f4; --ink:#1b1f24; --muted:#5b6672; --panel:#ffffff; --line:#cdd4db;
  --y:#f5b800; --y-ink:#1b1f24; --shadow:0 10px 30px rgba(20,30,40,.12);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#14171a; --ink:#eceff1; --muted:#9aa5b1; --panel:#1d2227; --line:#313941;
  --y:#ffc61a; --y-ink:#14171a; --shadow:0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{
  font-family:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--ink);
  transition:background .4s,color .4s;
  height:100dvh;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
  position:relative;
}
/* blueprint grid */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:40px 40px;
  -webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);
  mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);
}
/* hazard tape */
.tape{
  position:fixed;left:0;width:100%;height:clamp(14px,2.6vmin,22px);z-index:2;
  background:repeating-linear-gradient(-45deg,var(--y) 0 18px,var(--y-ink) 18px 36px);
  background-size:51px 100%;animation:tape 1.4s linear infinite;
}
.tape.top{top:0}.tape.bottom{bottom:0;animation-direction:reverse}
@keyframes tape{to{background-position:51px 0}}

.theme{
  position:fixed;top:calc(clamp(14px,2.6vmin,22px) + 12px);right:14px;z-index:3;
  width:46px;height:46px;border-radius:50%;border:2px solid var(--line);
  background:var(--panel);color:var(--ink);cursor:pointer;display:grid;place-items:center;
  box-shadow:var(--shadow);transition:transform .3s,background .4s,border-color .4s;
}
.theme:hover{transform:rotate(20deg)}
.theme svg{width:22px;height:22px;grid-area:1/1;transition:transform .5s,opacity .3s}
.theme .moon{opacity:0;transform:rotate(-90deg) scale(.5)}
:root[data-theme="dark"] .theme .sun{opacity:0;transform:rotate(90deg) scale(.5)}
:root[data-theme="dark"] .theme .moon{opacity:1;transform:none}
:focus-visible{outline:3px solid var(--y);outline-offset:3px}

main{
  position:relative;z-index:1;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(8px,2vmin,18px);text-align:center;
  padding:clamp(28px,6vmin,56px) 20px;
}
.scene{width:clamp(150px,34vmin,300px);height:auto;flex:none}
.scene .stroke{stroke:var(--ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;transition:stroke .4s}
.scene .fill-y{fill:var(--y)}
.scene .fill-ink{fill:var(--ink);transition:fill .4s}
.hook{transform-origin:180px 34px;animation:swing 3.2s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(9deg)}50%{transform:rotate(-9deg)}}
.gear{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
.gear.rev{animation-direction:reverse;animation-duration:4s}
@keyframes spin{to{transform:rotate(360deg)}}
.hat{transform-box:fill-box;transform-origin:50% 100%;animation:bob 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

.code{
  display:inline-flex;align-items:center;gap:10px;
  font-family:'Barlow Condensed',sans-serif;font-weight:800;letter-spacing:.04em;
  font-size:clamp(.85rem,2.4vmin,1.05rem);
  background:var(--y);color:var(--y-ink);padding:4px 14px 4px 6px;border-radius:999px;
}
.code b{background:var(--y-ink);color:var(--y);border-radius:999px;padding:1px 10px;font-size:1.05em}
h1{
  font-family:'Barlow Condensed',sans-serif;font-weight:800;line-height:.95;
  font-size:clamp(2.4rem,11vmin,5.6rem);letter-spacing:-.01em;
}
.lead{color:var(--muted);font-size:clamp(.92rem,2.6vmin,1.15rem);line-height:1.5;max-width:34ch}
.lead strong{color:var(--ink);font-weight:600}

.progress{width:min(340px,80vw)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:10%;border-radius:99px;
  background:repeating-linear-gradient(-45deg,var(--y) 0 10px,var(--y-ink) 10px 20px);
  background-size:28px 100%;animation:tape 1s linear infinite;transform-origin:left;
  animation:tape 1s linear infinite,grow 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(.05)}}
.progress small{display:block;margin-top:6px;font-size:.8rem;color:var(--muted);font-weight:500}

.link{
  display:flex;align-items:center;gap:6px;max-width:min(92vw,420px);
  background:var(--panel);border:2px solid var(--line);border-radius:14px;
  padding:6px 6px 6px 14px;box-shadow:var(--shadow);transition:background .4s,border-color .4s;
}
.link span{font-weight:500;font-size:clamp(.85rem,2.4vmin,1rem);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copy{
  flex:none;display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:0;
  background:var(--y);color:var(--y-ink);font:600 .92rem 'Barlow',sans-serif;
  padding:10px 14px;border-radius:10px;transition:transform .15s,filter .2s;
}
.copy:hover{filter:brightness(1.07)}.copy:active{transform:scale(.95)}
.copy svg{width:18px;height:18px}
.copy .ok{display:none}
.copy.done .ok{display:block;animation:pop .35s}
.copy.done .cp{display:none}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}

.toast{
  position:fixed;left:50%;bottom:calc(clamp(14px,2.6vmin,22px) + 18px);z-index:3;
  transform:translate(-50%,30px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:500;font-size:.9rem;
  transition:transform .3s,opacity .3s;white-space:nowrap;
}
.toast.show{transform:translate(-50%,0);opacity:1}

@media (max-height:560px){
  .lead,.progress small{display:none}
  .scene{width:clamp(110px,26vmin,200px)}
}
@media (max-height:380px){ .progress{display:none} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="tape top" aria-hidden="true"></div>
<div class="tape bottom" aria-hidden="true"></div>

<button class="theme" id="theme" type="button" aria-label="Switch between light and dark theme">
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
</button>

<main>
  <svg class="scene" viewBox="0 0 240 160" role="img" aria-label="Crane lifting a block next to turning gears">
    <!-- crane tower -->
    <path class="stroke" d="M60 140V30M72 140V30M60 140l12-22M72 118l-12-22M60 96l12-22M72 74l-12-22M60 52l12-22"/>
    <!-- jib and counterweight -->
    <rect class="fill-ink" x="18" y="24" width="188" height="8" rx="2"/>
    <path class="stroke" d="M66 24L66 8M66 8L24 24M66 8L196 24"/>
    <rect class="fill-y" x="20" y="34" width="22" height="16" rx="2"/>
    <rect class="fill-y" x="74" y="34" width="14" height="14" rx="2"/>
    <!-- swinging hook and load -->
    <g class="hook">
      <path class="stroke" d="M180 34V74"/>
      <path class="stroke" d="M180 74v6"/>
      <rect class="fill-y" x="164" y="80" width="32" height="22" rx="3"/>
      <path class="stroke" d="M164 91h32M180 80v22" style="stroke-width:2"/>
    </g>
    <!-- ground -->
    <path class="stroke" d="M8 142H232"/>
    <!-- gears -->
    <g transform="translate(120 122)">
      <g class="gear">
        <circle class="stroke" r="15" stroke-width="7" stroke-dasharray="4.2 4.18" style="stroke-width:7;stroke:var(--y)"/>
        <circle class="fill-y" r="13"/>
        <circle class="fill-ink" r="5"/>
      </g>
    </g>
    <g transform="translate(150 130)">
      <g class="gear rev">
        <circle class="stroke" r="9" stroke-dasharray="3.5 3.2" style="stroke-width:5;stroke:var(--ink)"/>
        <circle class="fill-ink" r="8"/>
        <circle fill="var(--bg)" r="3"/>
      </g>
    </g>
    <!-- hard hat -->
    <g transform="translate(206 142)">
      <g class="hat">
        <path class="fill-y" d="M-16 0a16 16 0 0 1 32 0z"/>
        <rect class="fill-y" x="-20" y="-3" width="40" height="5" rx="2.5"/>
        <rect class="fill-ink" x="-3" y="-17" width="6" height="14" rx="2"/>
      </g>
    </g>
  </svg>

  <div class="code"><b>503</b>Page not available yet</div>
  <h1>Under construction</h1>
  <p class="lead"><strong>Al Madinah Duxi</strong> is being built. The site is not ready to view, but it will be live soon.</p>

  <div class="progress" role="progressbar" aria-valuenow="10" aria-valuemin="0" aria-valuemax="100" aria-label="Build progress">
    <div class="bar"><i></i></div>
    <small>Build progress: 10%</small>
  </div>

  <div class="link">
    <span id="url">almadinahduxi.vercel.app</span>
    <button class="copy" id="copy" type="button" aria-label="Copy website link">
      <svg class="cp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
      <svg class="ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      <em style="font-style:normal" id="copyTxt">Copy link</em>
    </button>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite">Link copied to clipboard</div>

<script>
(function(){
  var root=document.documentElement, KEY='amd-theme';
  var saved=null; try{saved=localStorage.getItem(KEY)}catch(e){}
  var dark=saved?saved==='dark':window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;
  root.setAttribute('data-theme',dark?'dark':'light');
  document.getElementById('theme').addEventListener('click',function(){
    var next=root.getAttribute('data-theme')==='dark'?'light':'dark';
    root.setAttribute('data-theme',next);
    try{localStorage.setItem(KEY,next)}catch(e){}
  });

  var URL_TEXT='https://almadinahduxi.vercel.app';
  var btn=document.getElementById('copy'), txt=document.getElementById('copyTxt'), toast=document.getElementById('toast'), t;
  function done(){
    btn.classList.add('done'); txt.textContent='Copied'; toast.classList.add('show');
    clearTimeout(t); t=setTimeout(function(){btn.classList.remove('done');txt.textContent='Copy link';toast.classList.remove('show')},2000);
  }
  function fallback(){
    var a=document.createElement('textarea'); a.value=URL_TEXT; a.style.position='fixed'; a.style.opacity='0';
    document.body.appendChild(a); a.select(); try{document.execCommand('copy')}catch(e){} document.body.removeChild(a); done();
  }
  btn.addEventListener('click',function(){
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(URL_TEXT).then(done,fallback)}else{fallback()}
  });
})();
</script>
</body>
</html>
