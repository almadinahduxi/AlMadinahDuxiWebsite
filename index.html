<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Al Madinah Duxi | Online Quran Academy</title>
<meta name="description" content="Al Madinah Duxi is an online Quran academy founded by Al Sheikh Muhammad Ali Chishti. Live classes in Tajweed, Nazra and Hifz.">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<header class="nav-wrap">
  <nav class="nav" aria-label="Main navigation">
    <a href="#home" data-scroll="#home">Home</a>
    <a href="#about" data-scroll="#about">About</a>
    <a href="#courses" data-scroll="#courses">Courses</a>
    <a href="#founder" data-scroll="#founder">Founder</a>
  </nav>
</header>

<main>
  <section class="hero" id="home" aria-labelledby="hero-title">
    <div class="hero__copy">
      <h1 class="hero__title" id="hero-title" aria-label="Learn the Holy Quran online">
        Learn the <span class="grad">Holy Quran</span>
        <span class="hero__type" data-words="online,anywhere,easily" aria-hidden="true"><span class="hero__word">online</span></span>
      </h1>
      <p class="hero__sub">
        Al Madinah Duxi is an online Quran academy. Live one-to-one classes in Tajweed, Nazra and Hifz for children and adults.
      </p>
      <div class="hero__actions">
        <button class="btn btn--primary" type="button" data-scroll="#courses">
          <span class="btn__label">Explore courses</span>
          <span class="btn__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 6.5C10.5 5.3 8.4 4.7 5 4.7v12.6c3.4 0 5.5.6 7 1.8 1.5-1.2 3.6-1.8 7-1.8V4.7c-3.4 0-5.5.6-7 1.8Z"/><path d="M12 6.5v12.6"/></svg></span>
        </button>
        <button class="btn btn--ghost" type="button" data-scroll="#founder">
          <span class="btn__label">Meet our founder</span>
          <span class="btn__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 19.5c.8-3.6 3.5-5.4 7-5.4s6.2 1.8 7 5.4"/></svg></span>
        </button>
      </div>
      <p class="hero__founder">Founded by <strong>Al Sheikh Muhammad Ali Chishti</strong></p>
    </div>

    <div class="showcase">
      <div class="stage">
        <figure class="device device--left" data-label="tablet-1.webp">
          <img src="./images/tablet-1.webp" alt="Al Madinah Duxi courses on a tablet" width="1362" height="966">
        </figure>
        <figure class="device device--center" data-label="mobile.webp">
          <img src="./images/mobile.webp" alt="Al Madinah Duxi class booking on a mobile phone" width="813" height="1595">
        </figure>
        <figure class="device device--right" data-label="tablet-2.webp">
          <img src="./images/tablet-2.webp" alt="Al Madinah Duxi frequently asked questions on a mobile phone" width="809" height="1590">
        </figure>
      </div>
    </div>
  </section>

  <!-- Next sections go here. Give each one an id that matches a nav link: about, courses, founder -->
</main>

<script src="./js/script.js"></script>
</body>
</html>
